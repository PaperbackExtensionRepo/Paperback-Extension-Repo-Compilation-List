<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Paperback Extension Repo — Paperback Extension &amp; Source Repo Compilation">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4d9d"/>
      <stop offset="0.5" stop-color="#c04bd6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="scrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140a18" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#140a18" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffd6e8"/>
    </linearGradient>
    <clipPath id="card">
      <rect x="2" y="2" width="1196" height="296" rx="26"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect x="0" y="0" width="1200" height="300" fill="url(#brand)"/>
    <rect x="0" y="0" width="1200" height="300" fill="url(#scrim)"/>
    <ellipse cx="600" cy="-40" rx="700" ry="150" fill="#a5f3fc" opacity="0.16"/>
    <ellipse cx="1080" cy="320" rx="360" ry="130" fill="#ff9ecb" opacity="0.2"/>
  </g>
  <rect x="2" y="2" width="1196" height="296" rx="26" fill="none" stroke="#a5f3fc" stroke-opacity="0.5" stroke-width="2"/>

  <!-- stacked books / library mark -->
  <g transform="translate(150,150)">
    <circle r="78" fill="#ffd6e8"/>
    <circle r="78" fill="none" stroke="#67e8f9" stroke-opacity="0.9" stroke-width="4"/>
    <g transform="translate(0,4)">
      <rect x="-44" y="16" width="88" height="20" rx="6" fill="#0e9bb5"/>
      <rect x="-38" y="-6" width="76" height="20" rx="6" fill="#c04bd6"/>
      <rect x="-32" y="-28" width="64" height="20" rx="6" fill="url(#page)"/>
      <path d="M-32,-46 h64" stroke="#ff4d9d" stroke-width="7" stroke-linecap="round"/>
    </g>
  </g>

  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#ffffff">
    <text x="270" y="140" font-size="58" font-weight="800">Paperback Extension Repo</text>
    <text x="272" y="192" font-size="24" font-weight="700" letter-spacing="3" opacity="0.96">EXTENSION &amp; SOURCE REPO COMPILATION</text>
    <text x="272" y="232" font-size="21" font-weight="600" letter-spacing="2" opacity="0.92">PAPERBACK 0.8 &amp; 0.9 · MANGA · MANHWA · MANHUA · NOVELS</text>
  </g>
</svg>
