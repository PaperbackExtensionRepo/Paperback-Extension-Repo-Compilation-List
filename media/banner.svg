<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Paperback Extension Repo — Paperback Extension &amp; Source Repo Compilation">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd7ea"/>
      <stop offset="0.45" stop-color="#e6d9fb"/>
      <stop offset="1" stop-color="#cdf3f4"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7ab8"/>
      <stop offset="0.5" stop-color="#b08bf0"/>
      <stop offset="1" stop-color="#4fd3e0"/>
    </linearGradient>
    <clipPath id="card">
      <rect x="3" y="3" width="1194" height="294" rx="30"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect x="0" y="0" width="1200" height="300" fill="url(#brand)"/>
    <circle cx="150" cy="-20" r="150" fill="#ffffff" opacity="0.45"/>
    <circle cx="1075" cy="315" r="165" fill="#ffffff" opacity="0.4"/>
    <circle cx="1010" cy="52" r="12" fill="#ffffff" opacity="0.85"/>
    <circle cx="1062" cy="96" r="7" fill="#ffffff" opacity="0.75"/>
    <circle cx="960" cy="104" r="6" fill="#ffffff" opacity="0.7"/>
  </g>
  <rect x="3" y="3" width="1194" height="294" rx="30" fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="3"/>

  <!-- stacked books mark -->
  <g transform="translate(152,150)">
    <circle r="82" fill="#ffffff" opacity="0.75"/>
    <circle r="82" fill="none" stroke="#ff7ab8" stroke-opacity="0.35" stroke-width="3"/>
    <g transform="translate(0,6)">
      <rect x="-46" y="14" width="92" height="21" rx="8" fill="#4fd3e0"/>
      <rect x="-39" y="-9" width="78" height="21" rx="8" fill="#b08bf0"/>
      <rect x="-32" y="-32" width="64" height="21" rx="8" fill="#ff7ab8"/>
      <path d="M-30,-50 h60" stroke="#ffb3d4" stroke-width="8" stroke-linecap="round"/>
    </g>
    <!-- little sparkle -->
    <path d="M56,-52 l5,13 13,5 -13,5 -5,13 -5,-13 -13,-5 13,-5 z" fill="#ffffff" opacity="0.95"/>
  </g>

  <g font-family="'Quicksand', 'Nunito', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="272" y="140" font-size="57" font-weight="700" fill="url(#ink)">Paperback Extension Repo</text>
    <text x="274" y="190" font-size="23" font-weight="700" letter-spacing="2.5" fill="#8a6f9c">EXTENSION &amp; SOURCE REPO COMPILATION</text>
    <text x="274" y="231" font-size="20" font-weight="600" letter-spacing="1.5" fill="#a68bb5">PAPERBACK 0.8 &amp; 0.9 · MANGA · MANHWA · MANHUA · NOVELS</text>
  </g>
</svg>
